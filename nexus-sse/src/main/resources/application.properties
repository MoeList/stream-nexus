spring.application.name=nexus-sse
server.port=8088

# 会话 Cookie 名：每个服务必须各不相同，否则同一浏览器无法同时登录多个服务。
# 浏览器只按 host 隔离 Cookie、不认端口，SSE(8088) 与 WebSocket(8089) 同跑在 localhost 时，
# 若都用容器默认的 JSESSIONID，后登录的服务会覆盖前一个写下的 Cookie，
# 表现为「任意一个登录就把另一个踢下线」。各自用独立名字后两者可并存、互不影响
server.servlet.session.cookie.name=NEXUS_SSE_SESSIONID

# 管理页登录态存哪：
#   单机（cluster.enabled=false）：容器内存 session，重启/换实例即失效，不依赖 Redis；
#   集群（cluster.enabled=true）：Spring Session Redis，键空间 {key-prefix}:session，
#       任一节点登录全集群可用、登出立即全部失效；Cookie 名两种模式一致，切模式不用改前端
# 空闲过期时间：集群模式写进 Redis 会话的失效时间；单机看下面的 server.servlet.session.timeout
spring.session.timeout=30m
# 单机（容器内存 session）的空闲过期时间：与 spring.session.timeout 保持一致，
# 否则同一个部署切到集群后登录态寿命会悄悄变长/变短
server.servlet.session.timeout=30m

# 异步请求不过期：SSE 长连接由 HeartbeatTask 依据心跳应答（PONG）自行回收
spring.mvc.async.request-timeout=0

# 页面模板（/admin 管理页为默认页，/console 推送测试页）；关缓存便于改页面即时生效
spring.thymeleaf.cache=false

# 心跳间隔（服务端 -> 客户端 PING），客户端收到后立即回 PONG，同时压制 LB / NAT 空闲断链
nexus.sse.heartbeat-interval=15s
# 心跳超时：超过该时间未收到 PONG 即判定失联并回收（应 >= 3 倍心跳间隔）
nexus.sse.heartbeat-timeout=90s
# 最大存活时间：软重置，客户端会自动重连；0 表示不限制
nexus.sse.max-lifetime=0
# 最大连接数，0 表示不限制
nexus.sse.max-connections=30000

# ===== 集群模式（默认关闭，单机不连接 Redis）=====
# false：纯单机，不创建 Redis 连接、不订阅频道，行为与改造前一致
# true：多节点通过 Redis Pub/Sub 广播推送，通过 Hash 共享节点/连接归属/应用台账；
# 管理页登录态同时切到 Spring Session Redis（复用同一个 Redis）
nexus.sse.cluster.enabled=false
# 节点ID：集群内唯一（node-1 / node-2）；留空用 host-port 兜底
# 容器部署务必显式配置，否则多个副本的 hostname 可能相同而互相覆盖
nexus.sse.cluster.node-id=
# 雪花ID 节点位：0~4095，集群内唯一；留空按 nodeId 哈希推导（有碰撞风险，生产请显式配置）
nexus.sse.cluster.node-seq=
# Redis Key / Channel 命名空间；SSE 与 WebSocket 共用同一个 Redis 时必须不同
nexus.sse.cluster.key-prefix=nexus:sse
# 管理页展示地址；留空用 host-port
nexus.sse.cluster.advertise-address=
# 节点心跳间隔 / 离线判定：超过 node-timeout 未续期即视为下线
nexus.sse.cluster.node-heartbeat-interval=5s
nexus.sse.cluster.node-timeout=30s
# 管理页聚合连接台账的等待上限；超时返回已收到的部分并标记 partial
nexus.sse.cluster.admin-timeout=500ms
# 快照响应 List 的 TTL，防止收集途中崩溃留下垃圾 Key
nexus.sse.cluster.snapshot-ttl=60s
# 应用台账本地缓存的保底刷新间隔：写入节点会广播 APPS_CHANGED，其他节点收到后立即重载；
# 这里只兜底「广播丢了 / 节点当时不在线」的情况，不必设得很短
nexus.sse.cluster.app-cache-ttl=30s
# 首次从单机迁移到集群时置 true，把本地 push-apps.json 导入 Redis 台账（只开一次）
nexus.sse.cluster.apps-import-on-startup=false
# 单条总线消息上限（字节），超过后拒绝推送而不是让消息在某个节点静默失败
nexus.sse.cluster.max-message-bytes=1048576
# Redis 协议：默认 resp3（Lettuce 默认，需 Redis 6+）；
# 老版本 Redis 或只支持 RESP2 的代理/测试替身设为 resp2，否则启动会报订阅注册超时
nexus.sse.cluster.redis-protocol=resp3

# 集群模式需指向同一个 Redis；单机模式保持注释即可（不会建立连接）
# 单节点：
#spring.data.redis.host=127.0.0.1
#spring.data.redis.port=6379
#spring.data.redis.password=
#spring.data.redis.database=0
#spring.data.redis.timeout=3s
# Redis Cluster：逗号分隔的种子节点，客户端会自动发现完整拓扑；
# 集群模式（nexus.sse.cluster.enabled=true）配这一组，不要再配 host/port
#spring.data.redis.cluster.nodes=127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
#spring.data.redis.cluster.max-redirects=3
#spring.data.redis.timeout=3s

# 本项目只用 RedisTemplate / Pub-Sub，不用 Spring Data Redis 的 Repository 抽象；
# 关掉扫描可以少一次 classpath 扫描，也避免单机模式因依赖存在而多做无意义初始化
spring.data.redis.repositories.enabled=false

# 台账 IP 归属地（城市）：离线库 ip2region 的数据文件，支持 classpath: / file: 前缀。
# 数据文件需自备（11MB 二进制，不入仓库）：放到 nexus-sse/src/main/resources/ip2region.xdb，
# 或改这里指向绝对路径。文件缺失只影响城市列（显示 -），其余功能不受影响；
# 客户端全是内网地址时本就用不到——私有地址直接判为「局域网」，不查库
nexus.sse.ip2region-path=classpath:ip2region_v4.xdb

# 推送鉴权：X-Sse-AppId 限定应用，X-Sse-Key 校验密钥，二者必须配对匹配
nexus.sse.auth-enabled=true
# 推送应用（appId / apiKey）不在此配置：内置默认应用 test-demo / c3RyZWFtLW5leHVz（白名单 test），
# 该默认应用只读（不可改、不可删），要别的凭证请在管理页新建
# 其余应用在 /admin 管理页「推送应用」页签运行时增删：
#   单机（cluster.enabled=false）：落盘到下面的 JSON 文件，重启后读回；
#   集群（cluster.enabled=true）：存 Redis Hash {key-prefix}:apps，多节点共享，任一节点改动立即生效；
#   此时下面的路径只在首次迁移时用（apps-import-on-startup=true 时导入一次）
# 相对路径以模块根目录（nexus-sse）为基准，不受启动工作目录影响
nexus.sse.app-store-path=data/push-apps.json

# 建连鉴权：false = 关闭（默认），任何客户端都能直接 /sse/subscribe；
# 开启后必须携带下面这个令牌才能建连（请求头 X-Sse-Token 或查询参数 token 二选一）
nexus.sse.connect-auth-enabled=false
# 建连令牌：一个共享口令，所有客户端共用；开关打开但此处留空时，建连一律拒绝（失败关闭）
nexus.sse.connect-auth-token=57yW56iL5pyd6Iqx5aSV5ou+

# 管理页登录：/admin、/console 与 /sse/admin/** 需登录后访问（默认 admin / adminsse）
# 与上面两套鉴权无关：那两套管「谁能推」「谁能连」，这套管「谁能打开运维页面」
nexus.sse.admin.auth-enabled=true
nexus.sse.admin.username=admin
# 部署务必改掉默认口令：拿到它等于拿到连接台账、强制下线与明文 apiKey
nexus.sse.admin.password=adminsse

logging.level.com.simonking.stream.nexus.sse=INFO

# 调度池：节点心跳（5s 一次）与业务心跳（遍历全部连接下发 PING）必须能并行。
# 默认只有 1 个线程，连接数大时业务心跳一旦超过 5s，节点心跳会被排队，
# 其他节点读到的 lastSeen 迟迟不更新，就会把本节点误判为离线并踢出注册表
spring.task.scheduling.pool.size=2
