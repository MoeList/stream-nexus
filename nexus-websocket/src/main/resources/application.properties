spring.application.name=nexus-websocket

# HTTP 端口：承载 REST 推送接口（POST /ws/push）、管理界面（/admin）、推送测试页（/console）与 REST 运维接口
server.port=8089

# 会话 Cookie 名：每个服务必须各不相同，否则同一浏览器无法同时登录多个服务。
# 浏览器只按 host 隔离 Cookie、不认端口，WebSocket(8089) 与 SSE(8088) 同跑在 localhost 时，
# 若都用容器默认的 JSESSIONID，后登录的服务会覆盖前一个写下的 Cookie，
# 表现为「任意一个登录就把另一个踢下线」。各自用独立名字后两者可并存、互不影响
server.servlet.session.cookie.name=NEXUS_WS_SESSIONID

# 管理页登录态存哪：
#   单机（cluster.enabled=false）：容器内存 session，重启/换实例即失效，不依赖 Redis；
#   集群（cluster.enabled=true）：Spring Session Redis，键空间 {key-prefix}:session，
#       任一节点登录全集群可用、登出立即全部失效；Cookie 名两种模式一致，切模式不用改前端
# 空闲过期时间：集群模式写进 Redis 会话的失效时间；单机看下面的 server.servlet.session.timeout
spring.session.timeout=30m
# 单机（容器内存 session）的空闲过期时间：与 spring.session.timeout 保持一致，
# 否则同一个部署切到集群后登录态寿命会悄悄变长/变短
server.servlet.session.timeout=30m

# 改页面即时生效
spring.thymeleaf.cache=false

# ==================================================================================
# 端口规划（同一进程三组端口，共享同一张终端连接注册表）
#   server.port：HTTP，业务系统调用 POST /ws/push 推消息，管理员访问页面
#   ws-port     ：Netty WebSocket，浏览器 / 移动端建长连接，只负责「接收」推送
#   tcp-port    ：Netty TCP，业务系统建长连接，把待推消息交进来（长连接版推送通道）
# ==================================================================================
nexus.ws.ws-port=9090
nexus.ws.ws-path=/ws
# TCP 服务端口（业务系统建连）。除端口外，TCP 通道不单独配置任何参数：
# 心跳节奏 / 单帧上限 / 连接上限 / Netty 线程数全部沿用下面的 WebSocket 配置
nexus.ws.tcp-port=9091

# ----------------------------------------------------------------------------------
# WebSocket 心跳（服务端 -> 客户端 PING，客户端回 PONG）
# ----------------------------------------------------------------------------------
# 写空闲 interval 秒未下发数据则发一次应用级 PING（浏览器拿不到协议层 ping/pong 帧，只能用业务帧）
nexus.ws.heartbeat-interval=15s
# 读空闲 timeout 秒未收到任何上行数据则判定失联并关闭连接（应 >= 3 倍心跳间隔）
nexus.ws.heartbeat-timeout=90s

# 最大 WebSocket 连接数，0 表示不限制
nexus.ws.max-connections=30000
# 单个 WebSocket 帧最大长度（字节）
nexus.ws.max-frame-length=65536

# 台账 IP 归属地（城市）：离线库 ip2region 的数据文件，支持 classpath: / file: 前缀。
# 数据文件需自备（11MB 二进制，不入仓库）：放到 nexus-websocket/src/main/resources/ip2region.xdb，
# 或改这里指向绝对路径。文件缺失只影响城市列（显示 -），其余功能不受影响；
# 客户端全是内网地址时本就用不到——私有地址直接判为「局域网」，不查库
nexus.ws.ip2region-path=classpath:ip2region_v4.xdb

# Netty 线程数：0 = 取 Netty 默认值（CPU 核数 * 2）
nexus.ws.boss-threads=1
nexus.ws.worker-threads=0

# ===== 集群模式（默认关闭，单机不连接 Redis）=====
# false：纯单机，不创建 Redis 连接、不订阅频道，台账落本地 JSON，行为与改造前一致
# true：多节点通过 Redis Pub/Sub 广播推送与踢下线，通过 Hash 共享节点/应用台账；
#       管理页连接台账按「请求-回复」向各节点收集快照，登录态切到 Spring Session Redis
nexus.ws.cluster.enabled=false
# 节点ID：集群内唯一（node-1 / node-2）；留空用 host-ws-port 兜底
# 容器部署务必显式配置，否则多个副本的 hostname 可能相同而互相覆盖
nexus.ws.cluster.node-id=
# 雪花ID 节点位：0~4095，集群内唯一；留空按 nodeId 哈希推导（有碰撞风险，生产请显式配置）
nexus.ws.cluster.node-seq=
# Redis Key / Channel 命名空间；SSE 与 WebSocket 共用同一个 Redis 时必须不同
nexus.ws.cluster.key-prefix=nexus:ws
# 管理页展示地址（host:port，一般填 WebSocket 接入地址）；留空用 host-ws-port
nexus.ws.cluster.advertise-address=
# 节点心跳间隔 / 离线判定：超过 node-timeout 未续期即视为下线
nexus.ws.cluster.node-heartbeat-interval=5s
nexus.ws.cluster.node-timeout=30s
# 管理页聚合连接台账的等待上限；超时返回已收到的部分并标记 partial
nexus.ws.cluster.admin-timeout=500ms
# 快照响应 List 的 TTL，防止收集途中崩溃留下垃圾 Key
nexus.ws.cluster.snapshot-ttl=60s
# 应用台账本地缓存的保底刷新间隔：写入节点会广播 APPS_CHANGED，其他节点收到后立即重载；
# 这里只兜底「广播丢了 / 节点当时不在线」的情况，不必设得很短
nexus.ws.cluster.app-cache-ttl=30s
# 首次从单机迁移到集群时置 true，把本地 push-apps.json 导入 Redis 台账（只开一次）
nexus.ws.cluster.apps-import-on-startup=false
# 单条总线消息上限（字节），超过后拒绝推送而不是让消息在某个节点静默失败
nexus.ws.cluster.max-message-bytes=1048576
# Redis 协议：默认 resp3（Lettuce 默认，需 Redis 6+）；
# 老版本 Redis 或只支持 RESP2 的代理/测试替身设为 resp2，否则启动会报订阅注册超时
nexus.ws.cluster.redis-protocol=resp3

# 集群模式需指向同一个 Redis；单机模式保持注释即可（不会建立连接）
# 单节点：
#spring.data.redis.host=127.0.0.1
#spring.data.redis.port=6379
#spring.data.redis.password=
#spring.data.redis.database=0
#spring.data.redis.timeout=3s
# Redis Cluster：逗号分隔的种子节点，客户端会自动发现完整拓扑；
# 集群模式（nexus.ws.cluster.enabled=true）配这一组，不要再配 host/port
#spring.data.redis.cluster.nodes=127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
#spring.data.redis.cluster.max-redirects=3
#spring.data.redis.timeout=3s

# 本项目只用 RedisTemplate / Pub-Sub，不用 Spring Data Redis 的 Repository 抽象；
# 关掉扫描可以少一次 classpath 扫描，也避免单机模式因依赖存在而多做无意义初始化
spring.data.redis.repositories.enabled=false

# ----------------------------------------------------------------------------------
# 鉴权：两条独立的链
# ----------------------------------------------------------------------------------
# 推送鉴权：X-Ws-AppId + X-Ws-Key，决定「谁能推」
# 应用不在配置文件中：内置默认应用 test-demo / c3RyZWFtLW5leHVz（白名单 test），
# 该默认应用只读（不可改、不可删），要别的凭证请在管理页新建
# 其余应用在 /admin 管理页「推送应用」页签运行时增删，并落盘到下面的文件（重启后仍在）
# 相对路径以模块根目录（nexus-websocket）为基准，不受启动工作目录影响；多实例部署请各自指向独立文件
nexus.ws.auth-enabled=true
nexus.ws.app-store-path=data/push-apps.json
# 建连鉴权：false = 关闭（默认），任何客户端都能直连 ws://host:9090/ws；
# 开启后必须携带下面的令牌（查询参数 token，WebSocket 握手无法自定义请求头）
nexus.ws.connect-auth-enabled=false
# 建连令牌：一个共享口令，所有客户端共用；开关打开但此处留空时，建连一律拒绝（失败关闭）
nexus.ws.connect-auth-token=U3RyZWFtTmV4dXM=

# ----------------------------------------------------------------------------------
# 管理页登录：/admin、/console 与 /ws/admin/** 需登录后访问（默认 admin / adminws）
# 与上面两套鉴权无关：那两套管「谁能推」「谁能连」，这套管「谁能打开运维页面」
# ----------------------------------------------------------------------------------
nexus.ws.admin.auth-enabled=true
nexus.ws.admin.username=admin
# 部署务必改掉默认口令：拿到它等于拿到连接台账、强制下线与明文 apiKey
nexus.ws.admin.password=adminws

# 控制台页面拼接 WebSocket 地址时使用（如 ws.example.com:9090）。
# 留空则自动取浏览器当前 hostname + nexus.ws.ws-port，适合本机直连调试
nexus.ws.public-endpoint=

logging.level.com.simonking.nexus.websocket=INFO
logging.level.io.netty=WARN
